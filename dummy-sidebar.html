<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Sources Sandbox - Light Theme</title>
    <!-- Include the extension styles to mock injection -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Mock Host Page Styles (Simulating NotebookLM Sources Panel) */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f3f4; /* Light mode bg */
            color: #3c4043;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #notebooklm-app {
            display: flex;
            width: 100%;
            padding: 16px;
            gap: 16px;
        }

        /* The target sidebar container - Sources Panel */
        .sources-panel {
            width: 320px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            display: flex;
            flex-direction: column;
            padding: 16px 0;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel-header {
            padding: 0 16px 16px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #5f6368;
            border-bottom: 1px solid #f1f3f4;
            display: flex;
            justify-content: space-between;
        }

        .select-all-wrapper {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #5f6368;
            border-bottom: 1px solid #f1f3f4;
        }

        /* Mock Native Source Items */
        .native-source-item {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
        }
        
        .native-source-item:hover {
            background-color: #f8f9fa;
        }

        .source-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .source-icon {
            color: #1a73e8;
            font-size: 16px;
        }

        .source-title {
            font-size: 0.9rem;
            color: #3c4043;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .native-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .main-content {
            flex-grow: 1;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #5f6368;
        }
    </style>
</head>
<body>

<div id="notebooklm-app">
    <!-- Target Sidebar -->
    <div class="sources-panel" data-testid="sources-sidebar">
        
        <div class="panel-header">
            <span>Sources</span>
            <span style="cursor: pointer;">ℹ️</span>
        </div>

        <div class="select-all-wrapper">
            <span>Select all sources</span>
            <input type="checkbox" class="native-checkbox master-checkbox" checked>
        </div>

        <div class="sources-list" data-testid="sources-list-container">
            <!-- Native React Rendered Items -->
            <div class="native-source-item" data-source-id="src_preface">
                <div class="source-info">
                    <span class="source-icon">📄</span>
                    <span class="source-title">Unit 00 Preface</span>
                </div>
                <input type="checkbox" class="native-checkbox source-checkbox" checked>
            </div>
            
            <div class="native-source-item" data-source-id="src_chem">
                <div class="source-info">
                    <span class="source-icon">📄</span>
                    <span class="source-title">Unit 01 The Chemistry of Life</span>
                </div>
                <input type="checkbox" class="native-checkbox source-checkbox" checked>
            </div>

            <div class="native-source-item" data-source-id="src_cell">
                <div class="source-info">
                    <span class="source-icon">📄</span>
                    <span class="source-title">Unit 02 The Cell</span>
                </div>
                <input type="checkbox" class="native-checkbox source-checkbox" checked>
            </div>

            <div class="native-source-item" data-source-id="src_genetics">
                <div class="source-info">
                    <span class="source-icon">📄</span>
                    <span class="source-title">Unit 03 Genetics</span>
                </div>
                <input type="checkbox" class="native-checkbox source-checkbox" checked>
            </div>
            
        </div>

    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        Mock Notebook Workspace (OpenStax's Biology)
    </div>
</div>

<script>
    // Add logic for mock native checkboxes so "Select All" works locally to mimic React behaviors
    const master = document.querySelector('.master-checkbox');
    const childBoxes = document.querySelectorAll('.source-checkbox');
    master.addEventListener('change', (e) => {
        childBoxes.forEach(b => b.checked = e.target.checked);
    });

    // Dynamically override selectors in content.js for testing
    window.addEventListener('load', () => {
        setTimeout(() => {
            if (window.SELECTORS) {
                window.SELECTORS.SIDEBAR_CONTAINER = '[data-testid="sources-sidebar"]';
                window.SELECTORS.SOURCES_LIST = '[data-testid="sources-list-container"]';
                window.SELECTORS.SOURCE_ITEM = '.native-source-item';
            }
            if (window.init) window.init();
        }, 100);
    });
</script>

<!-- Inject the extension script -->
<script src="content.js"></script>

</body>
</html>
